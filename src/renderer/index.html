<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Just a txt</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header id="titlebar">
      <div class="title-wrap">
        <span id="title-text" title="Double-click to rename"></span>
        <input id="title" spellcheck="false" autocomplete="off" aria-label="File name" hidden />
      </div>
      <div class="actions">
        <button id="more" class="icon-btn" title="More" aria-label="More">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <circle cx="5" cy="10" r="1.5" fill="currentColor" /><circle cx="10" cy="10" r="1.5" fill="currentColor" /><circle cx="15" cy="10" r="1.5" fill="currentColor" />
          </svg>
        </button>
      </div>
    </header>
    <main id="editor"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
