<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Just a txt</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header id="titlebar">
      <div class="title-wrap">
        <input id="title" spellcheck="false" autocomplete="off" aria-label="File name" />
      </div>
      <div class="actions">
        <button id="toggle-done" class="icon-btn" aria-pressed="false" title="Show completed">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <rect x="3" y="3" width="14" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path class="tick" d="M6.5 10.3l2.4 2.4 4.6-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="more" class="icon-btn" title="More">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <circle cx="5" cy="10" r="1.5" fill="currentColor" /><circle cx="10" cy="10" r="1.5" fill="currentColor" /><circle cx="15" cy="10" r="1.5" fill="currentColor" />
          </svg>
        </button>
      </div>
    </header>
    <main id="editor"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
